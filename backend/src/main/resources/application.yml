server:
  port: 8080

# 智谱 GLM API 配置（OpenAI 兼容格式）
# 请将下面的占位符替换为你的实际密钥
ai:
  api:
    key: YOUR_ZHIPU_API_KEY_HERE
    base-url: https://open.bigmodel.cn/api/paas/v4
    model: glm-4v-flash

# Spring 配置
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# 上传文件存储路径
upload:
  path: ./uploads

# HaloVault 数据库配置
halovault:
  db:
    path: ./data/halovault.db
    schema-version: 4
